name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@9d47c6ad4b8e538627bd60ee391fe4fbbb3c869b # v2.7.8

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Release build
        run: cargo build --release

      - name: Package
        run: cargo package --locked --allow-dirty

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install MSRV 1.81
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81"
      - name: Check MSRV
        run: cargo check --locked

  tty16-render:
    runs-on: ubuntu-latest
    env:
      TERM: linux
      NO_COLOR: "1"
      LC_ALL: C
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Render smoke under TTY16-like env
        run: cargo test --test render_smoke

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@e2f4ede4a4e60ea15ff31f74717fb496ad1794fa # v2.0.11
