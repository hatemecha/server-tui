name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: |
          set -euo pipefail
          if [ "${{ matrix.musl }}" = "true" ]; then
            cargo build --release --target ${{ matrix.target }} || {
              echo "musl build failed — skipping asset for this target"
              echo "SKIP=1" >> "$GITHUB_ENV"
              exit 0
            }
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package asset
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/server-tui
          NAME="server-tui-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p dist "${NAME}"
          cp "$BIN" "${NAME}/server-tui"
          cp LICENSE README.md "${NAME}/"
          tar -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.sha256")
          "$BIN" --version
          "$BIN" --help >/dev/null
          "$BIN" doctor --demo >/dev/null

      - name: Upload artifact
        if: env.SKIP != '1'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45ded1 # v4.6.0
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
      - name: Collect SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -name '*.tar.gz' -exec cp {} release/ \;
          find artifacts -type f -name '*.sha256' -exec cat {} \; > release/SHA256SUMS
          ls -la release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: release/*
          generate_release_notes: true
      - name: Attest
        uses: actions/attest-build-provenance@76685793973cc8041ebd39576081b88c04cafe2c # v2.1.0
        with:
          subject-path: "release/*.tar.gz"
