name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported primary target — failures must fail the job.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Experimental: on failure, skip asset only (do not fail whole release).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
    runs-on: ${{ matrix.os }}
    steps:
      # Actions use major tags (@v4) intentionally: prior full-SHA pins were
      # unverifiable / broken for this repo. Dependabot tracks github-actions.
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: |
          set -euo pipefail
          if [ "${{ matrix.musl }}" = "true" ]; then
            # Experimental musl: degrade by skipping asset, not by claiming success of a broken gnu build.
            cargo build --release --target ${{ matrix.target }} || {
              echo "EXPERIMENTAL musl build failed — skipping musl asset"
              echo "SKIP=1" >> "$GITHUB_ENV"
              exit 0
            }
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package asset
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/server-tui
          NAME="server-tui-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p dist "${NAME}"
          cp "$BIN" "${NAME}/server-tui"
          cp LICENSE README.md "${NAME}/"
          tar -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.sha256")
          # Smoke checks must not be ignored (no `|| true`).
          "$BIN" --version
          "$BIN" --help >/dev/null
          "$BIN" doctor --demo >/dev/null

      - name: Upload artifact
        if: env.SKIP != '1'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -name '*.tar.gz' -exec cp {} release/ \;
          find artifacts -type f -name '*.sha256' -exec cat {} \; > release/SHA256SUMS
          ls -la release
          # At least the supported gnu asset must exist.
          test -n "$(find release -type f -name '*x86_64-unknown-linux-gnu.tar.gz' | head -1)"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
      - name: Attest
        if: hashFiles('release/*.tar.gz') != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release/*.tar.gz"
