name: Bug report
description: Report a reproducible bug
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer `--read-only` or `--demo` when reproducing on production hosts.
        For security issues, use Security Advisories — see SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: server-tui version
      placeholder: output of server-tui --version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / distro
      placeholder: e.g. Ubuntu 24.04, Fedora 43
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: commands and keys pressed
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
