[package]
name = "server-tui"
version = "0.3.1"
edition = "2021"
rust-version = "1.85"
description = "Terminal UI for observing and administering a local Linux server"
license = "MIT"
readme = "README.md"
keywords = ["tui", "linux", "systemd", "sysadmin", "monitoring"]
categories = ["command-line-utilities"]
authors = ["hatemecha"]
repository = "https://github.com/hatemecha/server-tui"
homepage = "https://github.com/hatemecha/server-tui"
documentation = "https://github.com/hatemecha/server-tui#readme"

[[bin]]
name = "server-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1.91"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures = "0.3"
jwalk = "0.9"
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"
sysinfo = "0.39"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
