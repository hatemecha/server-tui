# Cargo deny configuration (licenses / bans / sources).
# Schema aligned with current cargo-deny (allow-list licenses; no deprecated keys).

[graph]
all-features = true

[advisories]
# Scope for unmaintained crates: all | workspace | transitive | none
unmaintained = "workspace"
yanked = "warn"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
